name: Release

# Ein Tag "vX.Y.Z" baut, testet und veröffentlicht ein Release mit den fertigen Dateien.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Build, test and publish
        shell: pwsh
        run: ./build.ps1 -Target All -Version $env:GITHUB_REF_NAME.TrimStart('v')

      - name: Package
        shell: pwsh
        run: ./tools/package-release.ps1 -OutputDirectory dist

      - name: Sign update manifest (latest.json)
        shell: pwsh
        env:
          RINGMOUSE_RELEASE_KEY: ${{ secrets.RINGMOUSE_RELEASE_KEY }}
        run: |
          if (-not $env:RINGMOUSE_RELEASE_KEY) { throw "Secret RINGMOUSE_RELEASE_KEY is not set - cannot sign the update manifest." }
          $version = $env:GITHUB_REF_NAME.TrimStart('v')
          $notes = "docs/release-notes/$env:GITHUB_REF_NAME.md"
          $keyFile = Join-Path $env:RUNNER_TEMP 'release.key'
          Set-Content -Path $keyFile -Value $env:RINGMOUSE_RELEASE_KEY -NoNewline
          try {
            dotnet run --project tools/RingMouse.ReleaseKey -c Release -- manifest `
              --key $keyFile --version $version --setup dist/RingMouse.exe --file RingMouse.exe `
              --notes-file $notes --out dist/latest.json
            if ($LASTEXITCODE) { throw "Signing the update manifest failed" }
          }
          finally {
            Remove-Item $keyFile -Force -ErrorAction SilentlyContinue
          }

      - name: Create GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $notes = "docs/release-notes/$env:GITHUB_REF_NAME.md"
          if (-not (Test-Path $notes)) { throw "Release notes missing: $notes" }
          gh release create $env:GITHUB_REF_NAME (Get-ChildItem dist -File).FullName --title "RingMouse $env:GITHUB_REF_NAME" --notes-file $notes --verify-tag
